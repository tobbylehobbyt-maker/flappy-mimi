<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#89d9ed"><title>Flappy Mimi 🐈‍⬛</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#89d9ed;font-family:system-ui,Arial,sans-serif}main{height:100%;display:grid;place-items:center}canvas{display:block;width:min(100vw,calc(100dvh * 0.5625));height:min(100dvh,calc(100vw * 1.7777778));touch-action:none;box-shadow:0 0 35px #23647a44}#help{position:absolute;bottom:8px;color:#173a45;font-size:12px;text-align:center;pointer-events:none}</style></head><body><main><canvas id="game" width="432" height="768" aria-label="Jeu Flappy Mimi"></canvas></main><div id="help">Espace / clic / toucher pour sauter · P pour pause</div><script>
(()=>{'use strict';const c=document.querySelector('#game'),x=c.getContext('2d'),W=432,H=768,ground=690;let state='ready',score=0,best=0,frame=0,pipes=[],cat={x:112,y:325,vy:0,r:19},spawn=0;try{best=Number(localStorage.getItem('flappy-mimi-best'))||0}catch{}const rand=(a,b)=>a+Math.random()*(b-a);function reset(){score=0;frame=0;spawn=0;pipes=[];cat={x:112,y:325,vy:0,r:19};state='ready'}function flap(){if(state==='paused'){state='playing';return}if(state==='over'){reset();state='playing'}else if(state==='ready')state='playing';cat.vy=-7.1}function action(e){if(e){e.preventDefault()}flap()}c.addEventListener('pointerdown',action);window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){if(e.repeat)return;action(e)}else if(e.code==='KeyP'){state=state==='playing'?'paused':state==='paused'?'playing':state}});function end(){state='over';if(score>best){best=score;try{localStorage.setItem('flappy-mimi-best',best)}catch{}}}function update(){frame++;if(state!=='playing')return;cat.vy=Math.min(cat.vy+.39,9);cat.y+=cat.vy;if(++spawn>=100){spawn=0;const gap=Math.max(164,205-score*1.5),top=rand(105,ground-gap-115);pipes.push({x:W+30,top,gap,passed:false})}for(const p of pipes){p.x-=2.7+Math.min(score*.035,1.2);if(!p.passed&&p.x+68<cat.x){p.passed=true;score++}if(cat.x+14>p.x&&cat.x-14<p.x+68&&(cat.y-14<p.top||cat.y+14>p.top+p.gap))end()}pipes=pipes.filter(p=>p.x>-90);if(cat.y+cat.r>=ground||cat.y-cat.r<0)end()}function roundRect(a,b,w,h,r,fill){x.fillStyle=fill;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}function cloud(a,b,s){x.fillStyle='#fff9';x.beginPath();x.ellipse(a,b,32*s,15*s,0,0,7);x.ellipse(a+21*s,b-8*s,24*s,19*s,0,0,7);x.ellipse(a-19*s,b-7*s,22*s,18*s,0,0,7);x.fill()}function drawCat(){x.save();x.translate(cat.x,cat.y);x.rotate(Math.max(-.35,Math.min(.9,cat.vy*.06)));x.strokeStyle='#17151e';x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(-12,10);x.bezierCurveTo(-38,22,-39,-12,-27,-17);x.stroke();x.fillStyle='#16141d';x.beginPath();x.ellipse(0,3,22,20,0,0,7);x.fill();x.beginPath();x.moveTo(-18,-8);x.lineTo(-17,-30);x.lineTo(-2,-17);x.lineTo(5,-17);x.lineTo(19,-30);x.lineTo(20,-6);x.closePath();x.fill();x.fillStyle='#e78aa8';x.beginPath();x.moveTo(-14,-17);x.lineTo(-13,-25);x.lineTo(-7,-18);x.moveTo(11,-18);x.lineTo(16,-25);x.lineTo(16,-16);x.fill();x.fillStyle='#f8efb1';for(const i of [-9,9]){x.beginPath();x.ellipse(i,-5,6.5,8,0,0,7);x.fill();x.fillStyle='#1b2030';x.beginPath();x.ellipse(i+1,-5,2,6,0,0,7);x.fill();x.fillStyle='#f8efb1'}x.fillStyle='#ef9bb5';x.beginPath();x.moveTo(-4,5);x.lineTo(4,5);x.lineTo(0,9);x.fill();x.strokeStyle='#fff';x.lineWidth=1.4;for(let j of [-1,1])for(let k of [-1,1]){x.beginPath();x.moveTo(j*5,10+k*2);x.lineTo(j*24,8+k*7);x.stroke()}x.restore()}function draw(){const grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#77d3f0');grad.addColorStop(1,'#d6f6ef');x.fillStyle=grad;x.fillRect(0,0,W,H);for(let i=0;i<4;i++)cloud(((i*155-frame*.28)%610+610)%610-80,105+i%2*95,.7+i%3*.22);x.fillStyle='#8ed5a0';for(let i=0;i<8;i++){x.beginPath();x.arc(i*75-15,ground+8,65,Math.PI,0);x.fill()}for(const p of pipes){for(const [y,h] of [[0,p.top],[p.top+p.gap,ground-(p.top+p.gap)]]){roundRect(p.x,y,68,h,4,'#278a68');roundRect(p.x+9,y,14,h,4,'#50d99a')}roundRect(p.x-6,p.top-25,80,25,4,'#166e55');roundRect(p.x-6,p.top+p.gap,80,25,4,'#166e55')}x.fillStyle='#5bb879';x.fillRect(0,ground,W,78);x.fillStyle='#d7b979';x.fillRect(0,ground+17,W,61);x.fillStyle='#368f61';x.fillRect(0,ground,W,7);for(let i=0;i<16;i++){x.fillStyle='#b49a62';x.fillRect(i*34+((frame*.5)%34),ground+30+(i%3)*12,12,3)}drawCat();x.textAlign='center';x.lineJoin='round';x.font='bold 55px system-ui';x.lineWidth=7;x.strokeStyle='#244a58';x.strokeText(score,W/2,80);x.fillStyle='#fff';x.fillText(score,W/2,80);if(state!=='playing'){x.fillStyle='#102b3d77';x.fillRect(0,0,W,ground);roundRect(37,218,358,260,24,'#fff8e8');x.fillStyle='#253e45';x.font='bold 42px system-ui';x.fillText('FLAPPY MIMI',W/2,281);x.font='20px system-ui';x.fillText(state==='over'?'Mimi est tombé !':state==='paused'?'Pause':'Fais voler Mimi 🐈‍⬛',W/2,332);x.font='bold 22px system-ui';if(state==='over')x.fillText(`Score : ${score}   ·   Record : ${best}`,W/2,374);else x.fillText(`Record : ${best}`,W/2,374);roundRect(83,400,266,51,14,'#248c6a');x.fillStyle='white';x.font='bold 20px system-ui';x.fillText(state==='over'?'REJOUER':state==='paused'?'REPRENDRE':'JOUER',W/2,434)}}let last=0,acc=0;function loop(t){acc+=Math.min(t-last||16,50);last=t;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
